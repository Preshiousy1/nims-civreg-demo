services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: civreg
      POSTGRES_PASSWORD: civreg
      POSTGRES_DB: civreg
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U civreg -d civreg']
      interval: 5s
      timeout: 3s
      retries: 10

  stub-identity-api:
    build: ./stub-identity-api
    ports:
      - '3041:3041'
    environment:
      PORT: 3041
      STUB_FAIL_NIN_REQUESTS: 'false'
      STUB_FAIL_DECEASED_STATUS: 'false'
      STUB_DELAY_MS: '0'
      STUB_READY: 'true'

  civreg-bridge:
    build: ./civreg-bridge
    ports:
      - '3042:3042'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
      - 'gateway.opencrvs.localhost:host-gateway'
    environment:
      PORT: 3042
      DATABASE_URL: postgres://civreg:civreg@postgres:5432/civreg
      RUN_MIGRATIONS: 'true'
      STUB_IDENTITY_URL: http://stub-identity-api:3041
      STUB_RETRY_ATTEMPTS: '3'
      STUB_RETRY_DELAY_MS: '200'
      OPENCRVS_TOKEN_URL: http://gateway.opencrvs.localhost/auth/token
      OPENCRVS_EVENTS_URL: http://gateway.opencrvs.localhost/events
      OPENCRVS_CLIENT_ID: a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d
      OPENCRVS_CLIENT_SECRET: demo-civreg-bridge-not-a-real-secret
      KAFKA_BROKERS: broker:19092
      JWT_SECRET: demo-civreg-jwt-not-a-real-secret
      INTERCEPT_SHARED_SECRET: demo-intercept-shared-secret
      RECONCILE_OLDER_THAN_MS: '30000'
    depends_on:
      postgres:
        condition: service_healthy
      stub-identity-api:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully

  # Official single-node KRaft plaintext from apache/kafka 4.4.0:
  # https://github.com/apache/kafka/blob/4.4.0/docker/examples/docker-compose-files/single-node/plaintext/docker-compose.yml
  # Host clients: localhost:9092. Other compose services: broker:19092.
  broker:
    image: apache/kafka:4.4.0
    hostname: broker
    ports:
      - '9092:9092'
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT_HOST://localhost:9092,PLAINTEXT://broker:19092'
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@broker:29093'
      KAFKA_LISTENERS: 'CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      CLUSTER_ID: '4L6g3nShT-eMCtK--X86sw'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'

  kafka-init:
    image: apache/kafka:4.4.0
    depends_on:
      - broker
    restart: 'no'
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        echo waiting for broker
        i=0
        until /opt/kafka/bin/kafka-topics.sh --bootstrap-server broker:19092 --list >/dev/null 2>&1; do
          i=$$((i+1))
          if [ "$$i" -gt 30 ]; then
            echo broker did not become ready
            exit 1
          fi
          sleep 2
        done
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server broker:19092 --create --if-not-exists --topic civreg.registry.events.v1 --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server broker:19092 --create --if-not-exists --topic civreg.audit.v1 --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server broker:19092 --list
