# Country specific overrides for the opencrvs-services chart in local Tilt development.
# Applied on top of tilt/examples/opencrvs-services/values.yaml and never overwritten by
# 'opencrvs upgrade'.

# DEMO system client + bridge URL for local intercept. Not production secrets.
# host.docker.internal reaches compose on the Mac from the countryconfig pod.
countryconfig:
  env:
    CIVREG_BRIDGE_URL: http://host.docker.internal:3042
    CIVREG_BRIDGE_CLIENT_ID: a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d
    CIVREG_BRIDGE_CLIENT_SECRET: demo-civreg-bridge-not-a-real-secret
    CIVREG_BRIDGE_INTERCEPT_SECRET: demo-intercept-shared-secret
